version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrivia-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-scrivia_user}:${POSTGRES_PASSWORD:-scrivia_secret_pass}@db:5432/${POSTGRES_DB:-scrivia}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - scrivia-network

  db:
    image: postgres:16-alpine
    container_name: scrivia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scrivia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrivia_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-scrivia}
    # Port 5432 lié exclusivement à localhost pour empêcher toute intrusion externe
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrivia_user} -d ${POSTGRES_DB:-scrivia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - scrivia-network

volumes:
  pgdata:
    name: scrivia_pgdata
  uploads_data:
    name: scrivia_uploads_data

networks:
  scrivia-network:
    name: scrivia-network
    driver: bridge
